<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Streethockeyclub Bulldozers Kernenried-Zauggenried">
  <defs>
    <path id="arcTop" d="M 50,108 Q 200,-14 350,108" fill="none" />
    <path id="arcBottom" d="M 42,208 Q 200,340 358,208" fill="none" />
  </defs>

  <ellipse cx="200" cy="160" rx="192" ry="152" fill="#ffffff" stroke="#0B5D36" stroke-width="15" />
  <ellipse cx="200" cy="160" rx="170" ry="132" fill="none" stroke="#0B5D36" stroke-width="4" />

  <text font-family="Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="2" fill="#0B5D36">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">STREETHOCKEYCLUB</textPath>
  </text>
  <text font-family="Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="1.5" fill="#0B5D36">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">KERNENRIED &#8211; ZAUGGENRIED</textPath>
  </text>

  <path d="M85,144 L88.82,154.74 L100.22,155.06 L91.18,162.01 L94.40,172.94 L85,166.5 L75.60,172.94 L78.82,162.01 L69.78,155.06 L81.18,154.74 Z" fill="#0B5D36" />
  <path d="M320,144 L323.82,154.74 L335.22,155.06 L326.18,162.01 L329.40,172.94 L320,166.5 L310.60,172.94 L313.82,162.01 L304.78,155.06 L316.18,154.74 Z" fill="#0B5D36" />

  <g transform="translate(0,-10) translate(198,158) scale(0.82) translate(-198,-158)">
    <!-- Fahrzeugkoerper / Schattensilhouette -->
    <path d="M118 178 q0 -34 30 -40 l18 -34 h58 l14 22 h10 q18 0 18 20 v18 h20 q10 0 10 12 v34 q0 10 -10 10 H130 q-14 0 -14 -14 z"
          fill="#0B5D36" />

    <!-- Fuehrerhaus -->
    <rect x="150" y="112" width="58" height="48" rx="3" fill="#ffffff" stroke="#0B5D36" stroke-width="6" />
    <line x1="150" y1="136" x2="208" y2="136" stroke="#0B5D36" stroke-width="4" />
    <line x1="223" y1="70" x2="223" y2="106" stroke="#0B5D36" stroke-width="7" stroke-linecap="round" />

    <!-- Schaufel / Bull-Dozers-Schild -->
    <path d="M118 170 L292 168 L272 236 L96 234 Z" fill="#B8952E" stroke="#0B5D36" stroke-width="7" stroke-linejoin="round" />
    <path d="M96 234 l10 12 l10 -12 M118 234 l10 12 l10 -12 M140 234 l10 12 l10 -12 M162 234 l10 12 l10 -12
             M184 234 l10 12 l10 -12 M206 234 l10 12 l10 -12 M228 234 l10 12 l10 -12 M250 234 l10 12 l10 -12 M272 234 l10 12 l10 -12"
          fill="#0B5D36" />

    <!-- Hockeystock-Schwung, ueber der Schaufel liegend -->
    <path d="M60 208 q-10 26 20 30 q34 5 58 -18 q8 -8 0 -16 q-7 -6 -15 1 q-20 18 -42 12 q-14 -4 -21 -9 z"
          fill="#0B5D36" stroke="#ffffff" stroke-width="3" />

    <text x="204" y="200" font-family="Arial, sans-serif" font-weight="900" font-size="30"
          fill="#ffffff" stroke="#0B5D36" stroke-width="1.4" text-anchor="middle" letter-spacing="1">BULL</text>
    <text x="204" y="228" font-family="Arial, sans-serif" font-weight="900" font-size="26"
          fill="#ffffff" stroke="#0B5D36" stroke-width="1.4" text-anchor="middle" letter-spacing="1">DOZERS</text>
  </g>
</svg>
